<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Fallback Art</title>
<style>
  :root { --bg: #f3f6f9; --ink: #101a26; --muted: #4b5664; --edge: rgba(16, 42, 80, 0.12); }
  @media (prefers-color-scheme: dark) { :root { --bg: #000105; --ink: #f4f7ff; --muted: rgba(244, 247, 255, 0.62); --edge: rgba(158, 198, 250, 0.18); } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, system-ui, sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 28px; line-height: 1.2; }
  p { margin: 0 0 28px; color: var(--muted); }
  h2 { margin: 28px 0 12px; font-size: 17px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  figure { margin: 0; }
  img { display: block; width: 100%; height: auto; border-radius: 16px; border: 1px solid var(--edge); }
  figcaption { margin-top: 8px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>School fallback art</h1>
  <p>Shown when a school has no real campus photo. One drawing, one glow, the same on every card.</p>

  <h2>Square (school cards)</h2>
  <div class="grid">
    <figure><img src="assets/college-dark.svg" alt="School hall line drawing, dark"><figcaption>Dark</figcaption></figure>
    <figure><img src="assets/college-light.svg" alt="School hall line drawing, light"><figcaption>Light</figcaption></figure>
  </div>

  <h2>Wide (short, wide cards)</h2>
  <div class="grid">
    <figure><img src="assets/college-dark-wide.svg" alt="School hall line drawing, dark, wide"><figcaption>Dark</figcaption></figure>
    <figure><img src="assets/college-light-wide.svg" alt="School hall line drawing, light, wide"><figcaption>Light</figcaption></figure>
  </div>
</main>
</body>
</html>
